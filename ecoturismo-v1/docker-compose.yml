version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: ecoturismo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
      MONGO_INITDB_DATABASE: ecoturismo
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecoturismo-network

  redis:
    image: redis:7.2-alpine
    container_name: ecoturismo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - ecoturismo-network

  backend:
    build: ./backend
    container_name: ecoturismo-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:secret123@mongodb:27017/ecoturismo?authSource=admin
      REDIS_URL: redis://:redis123@redis:6379
      JWT_SECRET: super-secret-key-change-in-production
      JWT_REFRESH_SECRET: another-super-secret-key
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - ecoturismo-network

  frontend:
    build: ./frontend
    container_name: ecoturismo-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ecoturismo-network

volumes:
  mongodb_data:
  redis_data:

networks:
  ecoturismo-network:
    driver: bridge